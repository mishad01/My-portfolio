name: Deploy to GitHub Pages

on:
  push:
    branches: [astro-site]
  workflow_dispatch:
  # Picks up admin "Publish" clicks: rebuilds only if Firestore changed.
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
      - uses: actions/setup-node@v4
        if: github.event_name == 'schedule'
        with: { node-version: 22 }
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/needs-deploy.mjs
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  # mishad01.github.io is a separate repo (GitHub only serves the bare
  # <user>.github.io domain from a repo with that exact name), so this job
  # builds here and pushes the static output there directly — it can't use
  # actions/deploy-pages, which only targets this repo's own Pages site.
  build-and-deploy:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.PUBLIC_FIREBASE_STORAGE_BUCKET }}
          PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
          PUBLIC_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.PUBLIC_FIREBASE_APPCHECK_SITE_KEY }}
          PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ vars.PUBLIC_CLOUDINARY_CLOUD_NAME }}
          PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ vars.PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
      - name: Push build to mishad01.github.io
        env:
          TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PAGES_DEPLOY_TOKEN secret is not set. Add a fine-grained PAT (Contents: Read and write, scoped to mishad01/mishad01.github.io) in this repo's Settings → Secrets and variables → Actions."
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/mishad01/mishad01.github.io.git" target
          rsync -a --delete --exclude '.git' dist/ target/
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "Deploy ${{ github.sha }}"
          git push origin main
